name: contrast

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # No Sanity credentials here on purpose. Without them the pages render
      # from the locale files, which is the path nobody looks at in a browser
      # and therefore the one most likely to rot.
      - run: pnpm build

      - name: Start server
        run: |
          pnpm start &
          pnpm exec wait-on http://localhost:3000/en --timeout 90000

      - run: pnpm audit:contrast --base http://localhost:3000
